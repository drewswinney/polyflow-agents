name: handheld-push
label: Handheld
kind: platform
version: 0.2.0
description: >
  Push notifications for the Polyflow Agents app. Registers observer hooks for
  approvals, clarify questions and artifacts, a send-only gateway platform so
  cron jobs can deliver to a phone, and backend routes under
  /api/plugins/handheld-push/ where devices register.
author: Drew Swinney
optional_env:
  - name: HANDHELD_HOME_CHANNEL
    description: "Cron delivery target for `deliver=handheld`. Any non-empty value; devices come from the registry, not from here."
    prompt: "Handheld cron delivery target"
    password: false
