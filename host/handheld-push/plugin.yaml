name: handheld-push
label: Handheld
kind: platform
version: 0.1.0
description: >
  Push notifications for the Hermes Handheld app. Registers observer hooks for
  approvals, clarify questions and artifacts, and a send-only gateway platform
  so cron jobs can deliver to a phone and the webhook gateway has somewhere to
  hand a device registration.
author: Drew Swinney
optional_env:
  - name: HANDHELD_HOME_CHANNEL
    description: "Cron delivery target for `deliver=handheld`. Any non-empty value; devices come from the registry, not from here."
    prompt: "Handheld cron delivery target"
    password: false
